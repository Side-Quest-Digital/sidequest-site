<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Reverse Audio rounded-square symbol</title>
  <desc id="desc">The Reverse Audio mirror-waveform symbol on a rounded violet-to-pink square.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C2BD9"/><stop offset="0.46" stop-color="#8B4DE8"/>
      <stop offset="0.55" stop-color="#C14FD0"/><stop offset="1" stop-color="#F0559D"/>
    </linearGradient>
    <filter id="seamGlow" x="-400%" y="-20%" width="900%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#brand)"/>
  <g fill="#FFFFFF">
    <rect x="174" y="468" width="28" height="88" rx="14"/><rect x="222" y="428" width="28" height="168" rx="14"/>
    <rect x="270" y="376" width="28" height="272" rx="14"/><rect x="318" y="318" width="28" height="388" rx="14"/>
    <rect x="366" y="252" width="28" height="520" rx="14"/><rect x="414" y="194" width="28" height="636" rx="14"/>
    <rect x="462" y="274" width="28" height="476" rx="14"/><rect x="534" y="274" width="28" height="476" rx="14"/>
    <rect x="582" y="194" width="28" height="636" rx="14"/><rect x="630" y="252" width="28" height="520" rx="14"/>
    <rect x="678" y="318" width="28" height="388" rx="14"/><rect x="726" y="376" width="28" height="272" rx="14"/>
    <rect x="774" y="428" width="28" height="168" rx="14"/><rect x="822" y="468" width="28" height="88" rx="14"/>
  </g>
  <rect x="508" y="142" width="8" height="740" rx="4" fill="#FFFFFF" filter="url(#seamGlow)"/>
</svg>
